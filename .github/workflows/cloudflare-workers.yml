name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - mst
          - qas
          - tst
          - staging
          - production
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC (01:00 EST) — picks up scheduled posts
    # Posts dated 09:00 America/Chicago would otherwise wait until the 06:00 UTC build,
    # and the afternoon social slots (16:26/17:33) would link to a 404. One of these is
    # 09:10 local in each half of the year (CDT 14:10 UTC, CST 15:10 UTC).
    - cron: "10 14 * * *"
    - cron: "10 15 * * *"

# Wrangler comes from the in-cluster Verdaccio npm pull-through proxy (a cache we run,
# cluster-services npm-proxy/; cluster-services-1030), not live from registry.npmjs.org. The
# self-hosted-linux runners are in a1-ops-prd, where this name resolves. No silent upstream
# fallback: a mirror outage fails the install visibly. Pinned to the version the deploys already
# used (4.86.0, run 39008946036); the old unpinned `npm install -g wrangler` took whatever was
# latest. Bump deliberately.
env:
  # Dart Sass for the m10c theme's css.Sass (transpiler: dartsass). Hugo dropped
  # libsass support (deprecated in v0.153.0), so every job that builds the site
  # needs this on PATH. Build-path tier: pinned upstream fetch from GitHub
  # releases, sha256-verified, bounded retries. These are GitHub-hosted runners
  # with no runner image or mirror of ours yet; moving this onto a mirror is
  # tracked separately. To bump: take the sha256 "digest" of
  # dart-sass-<ver>-linux-x64.tar.gz from
  # `gh api repos/sass/dart-sass/releases/tags/<ver>`.
  DART_SASS_VERSION: '1.105.1'
  DART_SASS_SHA256: '9046fdd4a31a524a0020298c55d9e155d4c22363ef268e8992574335a72c6a6f'
  NPM_REGISTRY: http://verdaccio.npm-proxy.svc.a1-ops-prd.local/
  WRANGLER_VERSION: 4.86.0

jobs:
  Test:
    runs-on: self-hosted-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        # Build-path tier: Verdaccio pull-through cache (same mirror as wrangler).
        # npm rewrites the lockfile's registry.npmjs.org URLs to --registry
        # (replace-registry-host defaults to npmjs).
        run: npm ci --no-fund --registry="${NPM_REGISTRY}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          # Pinned deliberately. 'latest' makes peaceiris/actions-hugo resolve the
          # version at build time via https://formulae.brew.sh/api/formula/hugo.json,
          # so a Homebrew API outage fails every job before Hugo is even installed
          # (run 29658115531). A pinned version downloads straight from GitHub
          # releases. Bump intentionally after verifying the site builds clean.
          hugo-version: '0.168.0'
          extended: true

      - name: Install Dart Sass
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  $RUNNER_TEMP/dart-sass.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dart-sass/sass" --version

      - name: Check theme color contrast
        run: npm run check:contrast

      - name: Check heading structure
        run: npm run check:headings

      - name: Check category allow-list
        run: npm run check:categories

      - name: Check duplicate target paths
        run: npm run check:paths

      - name: Test Hugo build
        run: |
          npm run build:hugo -- --panicOnWarning
          npm run build:search

      - name: Check for expired content
        run: |
          cd blog
          hugo list expired

  Deploy-NonProd:
    runs-on: self-hosted-linux
    needs: Test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'production')
    strategy:
      matrix:
        environment: 
          - ${{ github.event.inputs.environment || 'development' }}
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        # Build-path tier: Verdaccio pull-through cache (same mirror as wrangler).
        # npm rewrites the lockfile's registry.npmjs.org URLs to --registry
        # (replace-registry-host defaults to npmjs).
        run: npm ci --no-fund --registry="${NPM_REGISTRY}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          # Pinned deliberately. 'latest' makes peaceiris/actions-hugo resolve the
          # version at build time via https://formulae.brew.sh/api/formula/hugo.json,
          # so a Homebrew API outage fails every job before Hugo is even installed
          # (run 29658115531). A pinned version downloads straight from GitHub
          # releases. Bump intentionally after verifying the site builds clean.
          hugo-version: '0.168.0'
          extended: true

      - name: Install Dart Sass
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  $RUNNER_TEMP/dart-sass.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dart-sass/sass" --version

      - name: Build Hugo site
        run: npm run build

      - name: Install Wrangler
        run: |
          set -eu
          if npm install -g --no-fund --loglevel=http --registry="${NPM_REGISTRY}" "wrangler@${WRANGLER_VERSION}" > /tmp/npm-wrangler.log 2>&1 \
             && grep -q "fetch GET 200 ${NPM_REGISTRY}" /tmp/npm-wrangler.log; then
            echo "npm source: mirror ${NPM_REGISTRY} ($(grep -c "fetch GET 200 ${NPM_REGISTRY}" /tmp/npm-wrangler.log) fetches)"
          else
            echo "npm source: MIRROR FAILED (${NPM_REGISTRY})"; tail -20 /tmp/npm-wrangler.log; exit 1
          fi
          wrangler --version

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Deploying to ${{ matrix.environment }} environment"
          wrangler deploy --env ${{ matrix.environment }}

      - name: Verify deployment
        run: |
          case "${{ matrix.environment }}" in
            "production")
              ENDPOINT="https://support.tools"
              ;;
            "staging")
              ENDPOINT="https://stg.support.tools"
              ;;
            "development")
              ENDPOINT="https://dev.support.tools"
              ;;
            "mst")
              ENDPOINT="https://mst.support.tools"
              ;;
            "qas")
              ENDPOINT="https://qas.support.tools"
              ;;
            "tst")
              ENDPOINT="https://tst.support.tools"
              ;;
          esac
          
          echo "Checking deployment at $ENDPOINT"
          # Wait a bit for deployment to propagate
          sleep 30
          
          # Check if site is responding
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ENDPOINT" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Deployment successful - site is responding"
          else
            echo "❌ Deployment may have issues - HTTP status: $HTTP_STATUS"
            exit 1
          fi
          
          # Check health endpoint
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ENDPOINT/healthz" || echo "000")
          if [ "$HEALTH_STATUS" = "200" ] || [ "$HEALTH_STATUS" = "301" ]; then
            echo "✅ Health check passed"
          else
            echo "⚠️  Health check returned status: $HEALTH_STATUS"
          fi

  Deploy-Staging:
    runs-on: self-hosted-linux
    needs: Test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        # Build-path tier: Verdaccio pull-through cache (same mirror as wrangler).
        # npm rewrites the lockfile's registry.npmjs.org URLs to --registry
        # (replace-registry-host defaults to npmjs).
        run: npm ci --no-fund --registry="${NPM_REGISTRY}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          # Pinned deliberately. 'latest' makes peaceiris/actions-hugo resolve the
          # version at build time via https://formulae.brew.sh/api/formula/hugo.json,
          # so a Homebrew API outage fails every job before Hugo is even installed
          # (run 29658115531). A pinned version downloads straight from GitHub
          # releases. Bump intentionally after verifying the site builds clean.
          hugo-version: '0.168.0'
          extended: true

      - name: Install Dart Sass
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  $RUNNER_TEMP/dart-sass.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dart-sass/sass" --version

      - name: Build Hugo site
        run: npm run build

      - name: Install Wrangler
        run: |
          set -eu
          if npm install -g --no-fund --loglevel=http --registry="${NPM_REGISTRY}" "wrangler@${WRANGLER_VERSION}" > /tmp/npm-wrangler.log 2>&1 \
             && grep -q "fetch GET 200 ${NPM_REGISTRY}" /tmp/npm-wrangler.log; then
            echo "npm source: mirror ${NPM_REGISTRY} ($(grep -c "fetch GET 200 ${NPM_REGISTRY}" /tmp/npm-wrangler.log) fetches)"
          else
            echo "npm source: MIRROR FAILED (${NPM_REGISTRY})"; tail -20 /tmp/npm-wrangler.log; exit 1
          fi
          wrangler --version

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Deploying to staging environment"
          wrangler deploy --env staging

      - name: Verify staging deployment
        run: |
          echo "Checking staging deployment at https://stg.support.tools"
          sleep 30
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://stg.support.tools" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed - HTTP status: $HTTP_STATUS"
            exit 1
          fi

  Deploy-Production:
    runs-on: self-hosted-linux
    needs: Deploy-Staging
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    environment:
      name: production
      url: https://support.tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        # Build-path tier: Verdaccio pull-through cache (same mirror as wrangler).
        # npm rewrites the lockfile's registry.npmjs.org URLs to --registry
        # (replace-registry-host defaults to npmjs).
        run: npm ci --no-fund --registry="${NPM_REGISTRY}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          # Pinned deliberately. 'latest' makes peaceiris/actions-hugo resolve the
          # version at build time via https://formulae.brew.sh/api/formula/hugo.json,
          # so a Homebrew API outage fails every job before Hugo is even installed
          # (run 29658115531). A pinned version downloads straight from GitHub
          # releases. Bump intentionally after verifying the site builds clean.
          hugo-version: '0.168.0'
          extended: true

      - name: Install Dart Sass
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  $RUNNER_TEMP/dart-sass.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dart-sass/sass" --version

      - name: Build Hugo site
        run: npm run build

      - name: Install Wrangler
        run: |
          set -eu
          if npm install -g --no-fund --loglevel=http --registry="${NPM_REGISTRY}" "wrangler@${WRANGLER_VERSION}" > /tmp/npm-wrangler.log 2>&1 \
             && grep -q "fetch GET 200 ${NPM_REGISTRY}" /tmp/npm-wrangler.log; then
            echo "npm source: mirror ${NPM_REGISTRY} ($(grep -c "fetch GET 200 ${NPM_REGISTRY}" /tmp/npm-wrangler.log) fetches)"
          else
            echo "npm source: MIRROR FAILED (${NPM_REGISTRY})"; tail -20 /tmp/npm-wrangler.log; exit 1
          fi
          wrangler --version

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Deploying to production environment"
          wrangler deploy --env production

      - name: Verify production deployment
        run: |
          echo "Checking production deployment at https://support.tools"
          sleep 30
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://support.tools" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Production deployment successful"
          else
            echo "❌ Production deployment failed - HTTP status: $HTTP_STATUS"
            exit 1
          fi

      - name: Create deployment notification
        run: |
          echo "🚀 Successfully deployed to production!"
          echo "URL: https://support.tools"
          echo "Version: ${{ github.sha }}"
          echo "Deployed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
