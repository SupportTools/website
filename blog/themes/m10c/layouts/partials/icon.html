{{- $icons := hugo.Data.m10c.icons -}}
{{- if isset $icons .name -}}
{{- $svg := index $icons .name -}}
{{- with .title -}}
  {{- $svg = replaceRE `<title>.*?</title>` (printf "<title>%s</title>" .) $svg -}}
  {{- $svg = replace $svg "<svg " `<svg role="img" ` -}}
{{- else -}}
  {{- $svg = replaceRE `<title>.*?</title>` "" $svg -}}
  {{- $svg = replace $svg "<svg " `<svg aria-hidden="true" focusable="false" ` -}}
{{- end -}}
{{ safeHTML $svg }}
{{- else -}}
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-link" aria-hidden="true" focusable="false">
  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
</svg>
{{- end -}}
