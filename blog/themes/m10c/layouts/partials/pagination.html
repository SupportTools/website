{{ with $.Paginator }}
{{ if gt .TotalPages 1 }}
{{ $current := .PageNumber }}
{{ $total := .TotalPages }}
<nav class="pagination" aria-label="Pagination">
<ul>
  {{ with .Prev }}
  <li class="page-item">
    <a class="page-link page-link-direction" href="{{ .URL }}" rel="prev">Previous</a>
  </li>
  {{ end }}
  <li class="page-status">Page {{ $current }} of {{ $total }}</li>
  {{ with .Next }}
  <li class="page-item">
    <a class="page-link page-link-direction" href="{{ .URL }}" rel="next">Next</a>
  </li>
  {{ end }}
</ul>
</nav>
{{ end }}
{{ end }}
