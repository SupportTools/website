{{- /* Post properties for PostHog. baseof.html merges them into every event
       through before_send. The properties come from post-props.html. */ -}}
{{- if and .IsPage (in (slice "post" "known-good-designs" "training") .Section) -}}
{{- $props := partial "post-props.html" . -}}
<script type="application/json" id="post-analytics">{{ $props | jsonify | safeJS }}</script>
{{ end -}}
