{{ define "main" }}
<article class="archive">
  <header class="page-intro">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="page-intro-summary">{{ . }}</p>{{ end }}
  </header>
  {{ partial "posts-list.html" .Paginator.Pages }}
  {{ partial "pagination.html" $ }}
</article>
{{ end }}
