# Category map: DRAFT for owner review. Applied by scripts/rewrite-categories.mjs.
#
# Every source label below is rewritten on every post under blog/content.
# Nothing is deleted: a demoted label stays on the post as a tag.
#
# merge:   "Source": "Target"
#   Replaces Source with Target in the post's categories (duplicates collapse).
#   Use for case variants, plurals, slash names and clear synonyms.
# demote:  "Source": "Fallback"   (Fallback may be null)
#   Removes Source from categories and adds it to the post's tags (skipped if an
#   equal tag exists, ignoring case and hyphens). If that leaves a post with no
#   category at all, Fallback becomes its category. A null fallback on such a
#   post is an error: the script refuses to run until the map is fixed.
# hubs:    "Hub": followed by "- Category" lines
#   Documentation only. Groups the final categories under the ten top-level
#   hubs for the dry-run report and for hub landing pages. Does not change posts.
#
# Rules: a target or fallback must never itself be a source (no chains), a
# demoted label may not contain "/" or "&" (it would become a tag URL with a
# nested path), and every final name must be added to blog/data/categories.yaml
# when this map is applied. Categories not listed here are left unchanged.

