baseURL = "https://support.tools/"
title = "Support Tools"
theme = "m10c"
pagination.pagerSize = 8 # Updated from paginate
locale = "en-US"
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]
  page = ["HTML", "Markdown"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
  root = true

[menu]
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 10

  [[menu.main]]
    identifier = "categories"
    name = "Topics"
    url = "/categories/"
    weight = 20

  [[menu.main]]
    identifier = "training"
    name = "Training"
    url = "/training/"
    weight = 30

  [[menu.main]]
    identifier = "known-good-designs"
    name = "Reference Designs"
    url = "/known-good-designs/"
    weight = 40

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50

[params]
  feedbackUrl = "https://github.com/supporttools/website/issues/new"
  author = "Matthew Mattox"
  description = "Practical guides for Kubernetes, Linux, networking, observability, automation, and production infrastructure."
  avatar = "https://cdn.support.tools/profiles/avatar-centered.png"
  favicon = "/favicon.ico"
  images = ["/images/logo.png"]
  menu_item_separator = " - "

  [[params.social]]
    icon = "github"
    name = "GitHub"
    url = "https://github.com/mattmattox"

  [[params.social]]
    icon = "twitter"
    name = "Twitter"
    url = "https://twitter.com/cube8021"

  [[params.social]]
    icon = "brand-bluesky"
    name = "BlueSky"
    url = "https://bsky.app/profile/support.tools"

  [[params.social]]
    icon = "linkedin"
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/matthewmattox/"

  [[params.social]]
    icon = "reddit"
    name = "Reddit"
    url = "https://www.reddit.com/user/cube8021/"

  googleAnalytics = "UA-151436906-1"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[security]
  [security.funcs]
    getenv = ["^HUGO_"]

